name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test-lint-firebase:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.19.0'
                  cache: 'npm'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run linter
              run: npm run lint

            - name: Run Jest tests
              run: npm run test

            - name: Run Firebase emulator tests
              run: npm run test:firebase

            - name: Run Playwright e2e tests
              run: xvfb-run --auto-servernum npm run test:e2e
              env:
                NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY
                NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-talloc.firebaseapp.com
                NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-talloc
                NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-talloc.appspot.com
                NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
                NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:000000000000000000"
                NEXTAUTH_SECRET: Dummy-Secret
                NEXTAUTH_URL: http://localhost:3000

    deploy-firestore-rules:
        name: Deploy production Firestore rules
        needs: test-lint-firebase
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: firebase-production
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: production-firestore-rules
            cancel-in-progress: false
        steps:
            - name: Checkout tested commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Reject superseded commits
              shell: bash
              run: |
                  set -euo pipefail
                  latest_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
                  test -n "$latest_commit"
                  if [ "$latest_commit" != "$GITHUB_SHA" ]; then
                      echo "A newer main commit exists. Refusing to deploy or certify superseded rules. Run the latest main commit."
                      exit 1
                  fi

            - name: Check deployment configuration
              env:
                  PROVIDER: ${{ vars.FIREBASE_RULES_IDENTITY_PROVIDER }}
                  SERVICE_ACCOUNT: ${{ vars.FIREBASE_RULES_SERVICE_ACCOUNT }}
              run: |
                  test -n "$PROVIDER" || { echo "Set FIREBASE_RULES_IDENTITY_PROVIDER in the firebase-production environment."; exit 1; }
                  test -n "$SERVICE_ACCOUNT" || { echo "Set FIREBASE_RULES_SERVICE_ACCOUNT in the firebase-production environment."; exit 1; }

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '20.19.0'

            - name: Obtain short-lived Google credentials
              id: auth
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  project_id: kings-talloc-1f638
                  workload_identity_provider: ${{ vars.FIREBASE_RULES_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.FIREBASE_RULES_SERVICE_ACCOUNT }}
                  token_format: access_token
                  access_token_lifetime: 600s
                  create_credentials_file: false
                  export_environment_variables: false

            - name: Deploy and verify Firestore rules
              run: node scripts/deployFirestoreRules.cjs
              env:
                  FIREBASE_RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
