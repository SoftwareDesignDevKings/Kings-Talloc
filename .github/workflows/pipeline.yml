name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-lint-firebase:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.19.0'
                  cache: 'npm'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Install Firebase CLI
              run: npm install -g firebase-tools

            - name: Run linter
              run: npm run lint

            - name: Run Jest tests
              run: npm run test

            - name: Run Firebase emulator tests
              run: npm run test:firebase
              env:
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

            - name: Run Playwright e2e tests
              run: npm run test:e2e
              env:
                NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY
                NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-talloc.firebaseapp.com
                NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-talloc
                NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-talloc.appspot.com
                NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
                NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:000000000000000000"
                NEXTAUTH_SECRET: Dummy-Secret
                NEXTAUTH_URL: http://localhost:3000
