# Put this at: .github/workflows/security-review.yml
#
# Runs Anthropic's Claude Code security reviewer once per PR, when the PR is
# (or becomes) ready for review. Draft PRs are skipped, so open PRs as drafts
# while you're still pushing commits and click "Ready for review" when done.
#
# Same file in every repo (KingsTrack, CST Apps, NetLab). Only
# .github/security-review-instructions.txt differs per repo.
#
# Setup:
#   1. The API key is the org secret CLAUDE_API_KEY (org Settings -> Secrets and
#      variables -> Actions), shared with selected repositories only. Add this repo
#      to its selected list to turn reviews on; remove it to turn them off.
#   2. Only give write access to this repo to people you trust with that key:
#      anyone with write access can read it.
#   3. GitHub repo -> Settings -> Actions -> General -> "Fork pull request workflows
#      from outside collaborators" -> "Require approval for all outside collaborators".
#      (The reviewer isn't hardened against prompt injection; only run it on trusted PRs.)
#
# Don't make this a required status check: if the spend limit is reached the
# review just stops with a warning, and PRs can still be merged.

name: Security Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write # to leave review comments

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # The upstream action (as of its Feb 2026 commit) still has two retired model IDs
      # baked in: the default audit model (claude-opus-4-1, retired Aug 2026) and the
      # API-key check in its false-positive filter (claude-3-5-haiku, retired Feb 2026).
      # The first would make every run fail; the second silently switches the filter off.
      # So we pin a known commit, patch those lines, and run it as a local action.
      - name: Fetch and patch security-review action
        run: |
          git clone --quiet https://github.com/anthropics/claude-code-security-review .security-review-action
          git -C .security-review-action checkout --quiet 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
          sed -i 's/claude-3-5-haiku-20241022/claude-haiku-5-5/' .security-review-action/claudecode/claude_api_client.py
          sed -i "s/node-version: '18'/node-version: '22'/" .security-review-action/action.yml
          grep -q 'claude-haiku-5-5' .security-review-action/claudecode/claude_api_client.py

      - name: Claude security review
        uses: ./.security-review-action
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-opus-5-5 # ~half the cost: claude-sonnet-5-5
          comment-pr: true
          claudecode-timeout: 20
          exclude-directories: .security-review-action,node_modules,frontend/dist
          # Must be absolute: the action reads it from its own folder, and a relative
          # path is silently ignored.
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security-review-instructions.txt
